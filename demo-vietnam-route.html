<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vietnam route video maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&subset=vietnamese&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/build/mp4-muxer.js"></script>
<style>
:root{
  --panel:#f3f4f6; --raised:#ffffff; --ink:#16181b; --muted:#5b616a; --line:#d7dbe0; --hover:#e8eaed;
  --accent:#f2c14e; --accent-ink:#1b1400;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#16181b; --raised:#1f2226; --ink:#eceef1; --muted:#9aa1aa; --line:#2d3137; --hover:#262a2f;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --panel:#16181b; --raised:#1f2226; --ink:#eceef1; --muted:#9aa1aa; --line:#2d3137; --hover:#262a2f;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--panel)}
body{margin:0;height:100%;background:var(--panel);color:var(--ink);
  font-family:"Be Vietnam Pro","Segoe UI",Roboto,system-ui,sans-serif;
  font-size:15px;line-height:1.5}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:minmax(0,1fr) 384px;height:100%}

/* stage */
.stage{background:#000;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;min-height:0}
#view{display:block;background:#000;box-shadow:0 0 0 1px rgba(255,255,255,.14);touch-action:manipulation}
.zoomctl{position:absolute;right:12px;top:12px;display:flex;align-items:center;border-radius:10px;background:rgba(20,20,22,.78);backdrop-filter:blur(8px);color:#eee;overflow:hidden;z-index:2}
.zoomctl button{border:0;background:transparent;color:#eee;height:32px;min-width:34px;font-size:18px;line-height:1}
.zoomctl button:hover{background:rgba(255,255,255,.12)}
.zoomctl #zoomReset{font-size:13px;min-width:56px;font-variant-numeric:tabular-nums}
.hint{position:absolute;left:16px;top:12px;margin:0;color:rgba(255,255,255,.55);font-size:13px;pointer-events:none}
.scrub{position:absolute;left:12px;right:12px;bottom:12px;display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:12px;background:rgba(20,20,22,.78);backdrop-filter:blur(8px);color:#eee}
.scrub[hidden]{display:none}
.scrub input{flex:1;accent-color:var(--accent);min-width:0}
.scrub .time{font-variant-numeric:tabular-nums;font-size:13px;color:#bbb;white-space:nowrap}
.scrub button{background:transparent;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:4px 10px;color:#eee;font-size:13px}
.scrub .icon{width:34px;height:30px;padding:0;display:grid;place-items:center}

/* panel */
.panel{overflow-y:auto;border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.head{padding:22px 22px 6px}
.head h1{margin:0;font-size:26px;line-height:1.15;font-weight:700;letter-spacing:-.01em}
.head h1 span{display:block;font-size:14px;font-weight:500;color:var(--muted);letter-spacing:.02em;margin-top:4px}
section{padding:16px 22px;border-bottom:1px solid var(--line)}
section:last-of-type{border-bottom:0}
h2{margin:0 0 10px;font-size:16px;font-weight:700}
.row-h{display:flex;align-items:baseline;justify-content:space-between}
.row-h span{color:var(--muted);font-size:13px}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--hover);border-radius:10px;padding:3px;margin-bottom:8px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 0;font-weight:500;color:var(--muted)}
.seg button[aria-selected="true"]{background:var(--raised);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
input[type=search]{width:100%;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--raised)}
.list{margin-top:8px;max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;background:var(--raised)}
.list h3{position:sticky;top:0;z-index:1;margin:0;padding:6px 12px;font-size:12px;font-weight:700;color:var(--muted);background:var(--raised);border-bottom:1px solid var(--line)}
.item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:7px 12px;border-bottom:1px solid var(--line)}
.item:hover{background:var(--hover)}
.item .nm{flex:1;min-width:0}
.item .ja{color:var(--muted);font-size:13px;margin-left:6px}
.item .sub{display:block;color:var(--muted);font-size:12px;line-height:1.3}
.item .badge{font-size:12px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:999px;padding:0 7px;line-height:20px}
.item .plus{color:var(--muted);font-size:18px;line-height:1}
.none{padding:14px 12px;color:var(--muted);font-size:14px;margin:0}

.tools{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tools button,.ghost{border:1px solid var(--line);background:var(--raised);border-radius:8px;padding:5px 10px;font-size:13px}
.tools button:hover,.ghost:hover{background:var(--hover)}
.tools button:disabled{opacity:.45;cursor:default}
#route{list-style:none;margin:0;padding:0;counter-reset:stop}
#route li{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
#route li:last-child{border-bottom:0}
#route .n{width:24px;height:24px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--accent);color:var(--accent-ink)}
#route .nm{flex:1;min-width:0;line-height:1.25}
#route .nm small{display:block;color:var(--muted);font-size:12px}
#route button{border:0;background:transparent;width:28px;height:28px;border-radius:6px;display:grid;place-items:center;color:var(--muted)}
#route button:hover{background:var(--hover);color:var(--ink)}
#route button:disabled{opacity:.3;cursor:default;background:transparent}
.empty{margin:0;color:var(--muted);font-size:14px}

.ctl{display:grid;grid-template-columns:1fr auto;align-items:center;gap:4px 12px;margin-bottom:12px}
.ctl:last-child{margin-bottom:0}
.ctl label{font-size:14px}
.ctl output{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.ctl .pair{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.ctl input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.ctl input[type=color]{width:38px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:var(--raised);flex:none}
.ctl select{grid-column:1/-1;width:100%;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--raised)}
.check{display:flex;gap:8px;align-items:center;font-size:14px;margin-top:4px}
.check input{accent-color:var(--accent);width:16px;height:16px}

.actions{position:sticky;bottom:0;margin-top:auto;padding:14px 22px 16px;background:var(--panel);border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{border-radius:10px;padding:10px 0;font-weight:700;border:1px solid var(--line);background:var(--raised)}
.actions .primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.actions button:disabled{opacity:.45;cursor:default}
.progress{grid-column:1/-1;display:flex;align-items:center;gap:10px;font-size:13px}
.progress[hidden]{display:none}
.bar{flex:1;height:6px;border-radius:3px;background:var(--hover);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent)}
.progress button{padding:3px 10px;font-weight:500;font-size:13px}
.msg{grid-column:1/-1;margin:0;font-size:13px;color:var(--muted)}
.msg:empty{display:none}
#again[hidden]{display:none}

@media (max-width:820px){
  body{height:auto}
  .app{grid-template-columns:1fr;height:auto}
  .stage{height:52vh;position:sticky;top:env(safe-area-inset-top,0px);z-index:3}
  .panel{border-left:0;overflow:visible}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#000}
}
@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto} }
</style>
</head>
<body>
<div class="app">
  <main class="stage" id="stage">
    <canvas id="view" aria-label="Map of Vietnam with your route"></canvas>
    <p class="hint" id="hint">Tap a province to add it. Scroll to zoom, drag to move.</p>
    <div class="zoomctl" role="group" aria-label="Map zoom">
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <button id="zoomReset" aria-label="Reset zoom">100%</button>
      <button id="zoomIn" aria-label="Zoom in">+</button>
    </div>
    <div class="scrub" id="scrub" hidden>
      <button class="icon" id="scrubPlay" aria-label="Pause"></button>
      <input type="range" id="scrubber" min="0" max="1" step="0.01" value="0" aria-label="Timeline">
      <span class="time" id="time">0:00 / 0:00</span>
      <button id="backPlan">Edit route</button>
    </div>
  </main>

  <aside class="panel">
    <header class="head">
      <h1>Vietnam route<span>Tạo video hành trình Việt Nam</span></h1>
    </header>

    <section>
      <h2>Add places</h2>
      <div class="seg" role="tablist">
        <button role="tab" aria-selected="true" data-tab="pref">Provinces</button>
        <button role="tab" aria-selected="false" data-tab="city">Cities</button>
      </div>
      <input type="search" id="q" placeholder="Search, e.g. Đà Nẵng or Da Nang" aria-label="Search places">
      <div class="list" id="list"></div>
    </section>

    <section>
      <div class="row-h"><h2>Your route</h2><span id="count"></span></div>
      <div class="tools">
        <button id="sortNS">Sort north to south</button>
        <button id="reverse">Reverse</button>
        <button id="clear">Clear</button>
      </div>
      <ol id="route"></ol>
      <p class="empty" id="emptyRoute">No stops yet. Pick places above, or tap a province on the map.</p>
    </section>

    <section>
      <h2>Style</h2>
      <div class="ctl"><label for="routeW">Route line</label><output id="routeWo"></output>
        <div class="pair"><input type="color" id="routeColor" aria-label="Route line color"><input type="range" id="routeW" min="1" max="14" step="0.5"></div></div>
      <div class="ctl"><label for="bend">Curve bend</label><output id="bendo"></output>
        <div class="pair"><input type="range" id="bend" min="-50" max="50" step="1"></div></div>
      <div class="ctl"><label for="prefW">Province outline</label><output id="prefWo"></output>
        <div class="pair"><input type="color" id="prefColor" aria-label="Province outline color"><input type="range" id="prefW" min="0.5" max="10" step="0.5"></div></div>
      <div class="ctl"><label for="cityR">City marker</label><output id="cityRo"></output>
        <div class="pair"><input type="color" id="cityColor" aria-label="City marker color"><input type="range" id="cityR" min="4" max="28" step="1"></div></div>
      <div class="ctl"><label for="mapW">Map outline</label><output id="mapWo"></output>
        <div class="pair"><input type="color" id="mapColor" aria-label="Map outline color"><input type="range" id="mapW" min="0.5" max="4" step="0.25"></div></div>
      <div class="ctl"><label for="landOpacity">Land fill</label><output id="landOpacityo"></output>
        <div class="pair"><input type="color" id="landColor" aria-label="Land fill color"><input type="range" id="landOpacity" min="0" max="100" step="1" aria-label="Land fill opacity"></div></div>
      <div class="ctl"><label for="labelSize">Place names</label><output id="labelSizeo"></output>
        <div class="pair"><input type="color" id="labelColor" aria-label="Place name color"><input type="range" id="labelSize" min="16" max="64" step="1"></div>
        <select id="labelLang" aria-label="Place name language">
          <option value="ja">Tiếng Việt</option>
          <option value="en">English</option>
          <option value="both">Tiếng Việt and English</option>
        </select>
      </div>
      <label class="check"><input type="checkbox" id="keepLabels"> Keep earlier place names on screen</label>
    </section>

    <section>
      <h2>Video</h2>
      <div class="ctl"><label for="format">Size</label><output></output>
        <select id="format">
          <option value="1920x1080">1920 × 1080, landscape</option>
          <option value="1080x1920">1080 × 1920, vertical for Reels and Shorts</option>
          <option value="1080x1080">1080 × 1080, square</option>
          <option value="1280x720">1280 × 720, smaller file</option>
        </select></div>
      <div class="ctl"><label for="speed">Travel speed</label><output id="speedo"></output>
        <div class="pair"><input type="range" id="speed" min="0.4" max="2.5" step="0.1"></div></div>
      <div class="ctl"><label for="pause">Pause at each stop</label><output id="pauseo"></output>
        <div class="pair"><input type="range" id="pause" min="0.3" max="4" step="0.1"></div></div>
      <div class="ctl"><label for="zoom">Map zoom</label><output id="zoomo"></output>
        <div class="pair"><input type="range" id="zoom" min="0.5" max="4" step="0.05"></div></div>
      <label class="check"><input type="checkbox" id="follow"> Camera follows the route</label>
    </section>

    <div class="actions">
      <button class="primary" id="play">Play</button>
      <button id="export">Export MP4</button>
      <div class="progress" id="prog" hidden><div class="bar"><i id="progBar"></i></div><span id="progText"></span><button id="cancel" class="ghost">Cancel</button></div>
      <button id="again" class="ghost" hidden style="grid-column:1/-1">Save the last video again</button>
      <p class="msg" id="msg" role="status"></p>
    </div>
  </aside>
</div>

function ringArea(p){let a=0;for(let i=0,n=p.length,j=n-1;i<n;j=i++)a+=p[j][0]*p[i][1]-p[i][0]*p[j][1];return a/2}

function bboxOf(pts,b){b=b||[Infinity,Infinity,-Infinity,-Infinity];for(const[x,y]of pts){if(x<b[0])b[0]=x;if(y<b[1])b[1]=y;if(x>b[2])b[2]=x;if(y>b[3])b[3]=y}return b}

const STORE="vietnamRouteMaker.v1";
try{const raw=localStorage.getItem(STORE);if(raw){const d=JSON.parse(raw);if(d.S)S={...DEFAULTS,...d.S};if(Array.isArray(d.route))route=d.route.filter(r=>r&&(r.kind==="pref"?PREFS[r.id-1]:CITIES[r.id]))}}catch(e){}
function persist(){try{localStorage.setItem(STORE,JSON.stringify({S,route}))}catch(e){}}

/* ---------- easing & math ---------- */
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const easeIO=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const easeOut=t=>1-Math.pow(1-t,3);
const easeBack=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
const smooth=t=>t*t*(3-2*t);
const lerp=(a,b,t)=>a+(b-a)*t;

function fit(b,aspect,pad,minH){
  const h=Math.max((b[3]-b[1])/2,(b[2]-b[0])/2/aspect)*pad;
  return {cx:(b[0]+b[2])/2,cy:(b[1]+b[3])/2,h:Math.max(h,minH)};
}
function unionBox(boxes){const b=[Infinity,Infinity,-Infinity,-Infinity];for(const x of boxes){b[0]=Math.min(b[0],x[0]);b[1]=Math.min(b[1],x[1]);b[2]=Math.max(b[2],x[2]);b[3]=Math.max(b[3],x[3])}return b}
const focusCam=(s,asp)=> s.kind==="pref" ? fit(s.bbox,asp,1.5,1.25) : {cx:s.x,cy:s.y,h:1.6};

function makeCurve(a,b){
  const dx=b.x-a.x, dy=b.y-a.y, L=Math.hypot(dx,dy);
  const k=S.bend/100, cx=(a.x+b.x)/2+dy*k, cy=(a.y+b.y)/2-dx*k;
  const pts=[], cum=[0]; const N=90;
  for(let i=0;i<=N;i++){const t=i/N,u=1-t;pts.push([u*u*a.x+2*u*t*cx+t*t*b.x,u*u*a.y+2*u*t*cy+t*t*b.y]);if(i)cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]))}
  return {pts,cum,total:cum[N],ctrl:[cx,cy],L};
}
function curvePath(ctx,c,f){
  const target=c.total*f; const p=c.pts;
  ctx.beginPath(); ctx.moveTo(p[0][0],p[0][1]);
  let tip=p[0];
  for(let i=1;i<p.length;i++){
    if(c.cum[i]>=target){const seg=c.cum[i]-c.cum[i-1];const k=seg?(target-c.cum[i-1])/seg:0;tip=[lerp(p[i-1][0],p[i][0],k),lerp(p[i-1][1],p[i][1],k)];ctx.lineTo(tip[0],tip[1]);return tip}
    ctx.lineTo(p[i][0],p[i][1]); tip=p[i];
  }
  return tip;
}

/* ---------- timeline ---------- */
const APPEAR=0.8, LINE_FADE=0.45, WAVE=1.0;
function buildTimeline(stops,asp){
  const items=[],legs=[];let keys=[];let t=0;
  if(!stops.length) return {items,legs,keys:[{t:0,c:fit(JAPAN,asp,1.04,0)}],dur:0};
  const curves=[];for(let i=0;i<stops.length-1;i++)curves.push(makeCurve(stops[i],stops[i+1]));
  const allBox=unionBox(stops.map(s=>s.bbox).concat(curves.map(c=>[c.ctrl[0],c.ctrl[1],c.ctrl[0],c.ctrl[1]])));
  const allCam=fit(allBox,asp,1.25,1.8);
  keys.push({t:0,c:focusCam(stops[0],asp)});
  t=0.6; items.push({at:t}); t+=APPEAR+S.pause;
  for(let i=0;i<curves.length;i++){
    const a=stops[i],b=stops[i+1],c=curves[i];
    const km=c.L*111;
    const D=Math.min(5.5,Math.max(1.4,1.1+km/420))/S.speed;
    legs.push({ts:t,te:t+D,c});
    const lb=unionBox([a.bbox,b.bbox,[c.ctrl[0],c.ctrl[1],c.ctrl[0],c.ctrl[1]]]);
    keys.push({t,c:focusCam(a,asp)});
    keys.push({t:t+D*0.45,c:fit(lb,asp,1.3,1.6)});
    keys.push({t:t+D+0.4,c:focusCam(b,asp)});
    t+=D; items.push({at:t}); t+=APPEAR+S.pause;
  }
  if(stops.length>1){keys.push({t,c:focusCam(stops[stops.length-1],asp)});t+=1.8;keys.push({t,c:allCam});t+=1.6}
  else t+=0.4;
  if(!S.follow) keys=[{t:0,c:allCam}];
  return {items,legs,keys,dur:t};
}
function camAt(keys,t){
  if(t<=keys[0].t)return keys[0].c;
  for(let i=1;i<keys.length;i++){
    if(t<keys[i].t){const a=keys[i-1],b=keys[i];const e=smooth(clamp((t-a.t)/(b.t-a.t||1)));
      return {cx:lerp(a.c.cx,b.c.cx,e),cy:lerp(a.c.cy,b.c.cy,e),h:Math.exp(lerp(Math.log(a.c.h),Math.log(b.c.h),e))}}
  }
  return keys[keys.length-1].c;
}

/* ---------- rendering ---------- */
const FONT='"Be Vietnam Pro","Segoe UI",Roboto,sans-serif';
function hexA(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16&255},${n>>8&255},${n&255},${a})`}

function render(ctx,W,H,st){
  const u=Math.min(W,H)/1080, plan=st.mode==="plan", t=st.t||0, tl=st.tl, stops=st.stops;
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; ctx.shadowBlur=0;
  ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
  const base= plan ? (()=>{const c=fit(JAPAN,W/H,1.04,0);return {cx:c.cx+pan.x,cy:c.cy+pan.y,h:c.h}})() : camAt(tl.keys,t);
  const cam={cx:base.cx,cy:base.cy,h:base.h/(plan?planZoom:S.zoom)};
  const s=H/(2*cam.h), ox=W/2-cam.cx*s, oy=H/2-cam.cy*s;
  const toS=(x,y)=>[x*s+ox,y*s+oy];
  st.view={s,ox,oy};
  const prog=stops.map((_,i)=>plan?1:clamp((t-tl.items[i].at)/APPEAR));
  let cur=-1; if(!plan)prog.forEach((p,i)=>{if(p>0)cur=i});
  ctx.setTransform(s,0,0,s,ox,oy); ctx.lineJoin="round"; ctx.lineCap="round";

  // land fill
  if(S.landOpacity>0){ctx.globalAlpha=S.landOpacity/100;ctx.fillStyle=S.landColor;ctx.fill(LAND,"evenodd")}
  // fills under the map lines
  stops.forEach((p,i)=>{if(p.kind!=="pref"||prog[i]<=0)return;
    ctx.globalAlpha=(plan?0.16:0.2)*easeOut(prog[i])*(plan||i===cur?1:0.75); ctx.fillStyle=S.prefColor; ctx.fill(p.path)});
  if(plan&&st.hover){ctx.globalAlpha=0.14;ctx.fillStyle=S.mapColor;ctx.fill(st.hover.path);
    ctx.globalAlpha=0.5;ctx.strokeStyle=S.mapColor;ctx.lineWidth=0.8*u/s;ctx.stroke(st.hover.path)}

  // sketch base map: Japan coastline only: main stroke + offset ghost stroke
  ctx.strokeStyle=S.mapColor;
  ctx.globalAlpha=0.85; ctx.lineWidth=S.mapW*u/s; ctx.stroke(LAND);
  ctx.save(); ctx.translate(1.1*u/s,0.8*u/s); ctx.globalAlpha=0.28; ctx.lineWidth=S.mapW*0.75*u/s; ctx.stroke(LAND); ctx.restore();

  // prefecture outlines
  stops.forEach((p,i)=>{if(p.kind!=="pref"||prog[i]<=0)return;
    const e=easeOut(prog[i]); ctx.strokeStyle=S.prefColor; ctx.lineWidth=S.prefW*u/s;
    if(!plan&&i===cur){ctx.shadowColor=S.prefColor;ctx.shadowBlur=16*u}
    if(prog[i]<1){
      ctx.globalAlpha=e*0.6; ctx.stroke(p.path);
      ctx.globalAlpha=1; ctx.setLineDash([p.mainLen*e,p.mainLen*2]); ctx.stroke(p.mainPath); ctx.setLineDash([]);
    } else {ctx.globalAlpha=(plan||i===cur)?1:0.7; ctx.stroke(p.path)}
    ctx.shadowBlur=0;
  });

  // route
  ctx.strokeStyle=S.routeColor; ctx.lineWidth=S.routeW*u/s; const tips=[];
  if(plan){for(let i=0;i<stops.length-1;i++){ctx.globalAlpha=0.6;curvePath(ctx,makeCurve(stops[i],stops[i+1]),1);ctx.stroke()}}
  else for(const g of tl.legs){if(t<=g.ts)continue;const f=easeIO(clamp((t-g.ts)/(g.te-g.ts)));
    const fade=1-clamp((t-g.te)/LINE_FADE); if(fade<=0)continue;
    ctx.globalAlpha=fade; ctx.shadowColor=S.routeColor; ctx.shadowBlur=10*u;
    const tip=curvePath(ctx,g.c,f); ctx.stroke(); ctx.shadowBlur=0; if(f<1)tips.push(tip)}

  // screen-space marks
  ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1;
  for(const tp of tips){const [x,y]=toS(tp[0],tp[1]);const r=Math.max(4*u,S.routeW*u*1.1);
    ctx.shadowColor=S.routeColor;ctx.shadowBlur=22*u;ctx.fillStyle=S.routeColor;ctx.beginPath();ctx.arc(x,y,r*1.4,0,7);ctx.fill();
    ctx.shadowBlur=0;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,y,r*0.7,0,7);ctx.fill()}
  stops.forEach((p,i)=>{if(prog[i]<=0)return;const [x,y]=toS(p.x,p.y);const pr=prog[i];
    if(p.kind==="city"){
      const R=S.cityR*u, e=easeBack(pr), col=S.cityColor;
      if(!plan){const w=(t-tl.items[i].at-APPEAR*0.75)/WAVE;
        if(w>0&&w<1){const e2=easeOut(w);ctx.globalAlpha=(1-w);ctx.strokeStyle=col;ctx.lineWidth=Math.max(2*u,R*0.22)*(1-w*0.5);
          ctx.beginPath();ctx.arc(x,y,R*(0.9+1.5*e2),0,7);ctx.stroke()}}
      ctx.globalAlpha=0.4;ctx.fillStyle="#000";ctx.beginPath();ctx.arc(x,y,R*e,0,7);ctx.fill();ctx.globalAlpha=1;
      ctx.strokeStyle=col;ctx.lineWidth=Math.max(1.5*u,R*0.22);ctx.beginPath();ctx.arc(x,y,R*0.82*e,0,7);ctx.stroke();
      ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,R*0.38*e,0,7);ctx.fill();
    } else {
      const r=Math.max(3.5*u,S.prefW*u*1.3)*easeBack(pr);ctx.fillStyle=S.prefColor;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
    }
  });

  // labels / numbers
  if(plan){
    stops.forEach((p,i)=>{const [x0,y0]=toS(p.x,p.y);const r=10*(st.px||1);
      const off=p.kind==="city"?S.cityR*u+r*0.6:r*0.9;const x=x0+off,y=y0-off;
      ctx.fillStyle=S.routeColor;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();
      ctx.fillStyle=lum(S.routeColor)>0.5?"#111":"#fff";ctx.font=`700 ${r*1.05}px ${FONT}`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(String(i+1),x,y+r*0.04)});
  } else {
    stops.forEach((p,i)=>{if(prog[i]<=0)return;if(!S.keepLabels&&i!==cur)return;
      // skip an older label when the same place is the current one
      if(i!==cur&&cur>=0&&stops[cur]===p)return;
      drawLabel(ctx,p,toS(p.x,p.y),i===cur,easeOut(prog[i]),u,W,H)});
  }
}
function lum(hex){const n=parseInt(hex.slice(1),16);const c=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*c[0]+.7152*c[1]+.0722*c[2]}
function drawLabel(ctx,p,[x,y],emph,e,u,W,H){
  if(x<0||x>W||y<0||y>H)return;
  const size=S.labelSize*u*(emph?1:0.66);
  let a=S.labelLang==="en"?p.en:p.ja, b=S.labelLang==="both"?p.en:null;
  const sz2=size*0.56, gap=size*0.12;
  ctx.font=`700 ${size}px ${FONT}`; const w1=ctx.measureText(a).width;
  let w2=0; if(b){ctx.font=`500 ${sz2}px ${FONT}`;w2=ctx.measureText(b).width}
  const w=Math.max(w1,w2), blockH=size+(b?gap+sz2:0), m=24*u, rise=(1-e)*12*u;
  let lx,ty,align;
  if(p.kind==="city"){
    const R=S.cityR*u+12*u;
    if(x+R+w>W-m){align="right";lx=x-R}else{align="left";lx=x+R}
    ty=y-blockH/2;
  } else {align="center";lx=x;ty=y-blockH-16*u}
  // keep inside frame
  if(align==="center")lx=clamp(lx,m+w/2,W-m-w/2);
  ty=clamp(ty,m,H-m-blockH)+rise;
  ctx.globalAlpha=e*(emph?1:0.72); ctx.textAlign=align; ctx.textBaseline="top"; ctx.lineJoin="round";
  ctx.font=`700 ${size}px ${FONT}`; ctx.strokeStyle="rgba(0,0,0,.85)"; ctx.lineWidth=size*0.2;
  ctx.strokeText(a,lx,ty); ctx.fillStyle=S.labelColor; ctx.fillText(a,lx,ty);
  if(b){ctx.font=`500 ${sz2}px ${FONT}`;ctx.lineWidth=sz2*0.22;const y2=ty+size+gap;ctx.strokeText(b,lx,y2);ctx.fillStyle=hexA(S.labelColor,0.78);ctx.fillText(b,lx,y2)}
  ctx.globalAlpha=1;
}

/* ---------- preview ---------- */
const $=id=>document.getElementById(id);
const view=$("view"), vctx=view.getContext("2d"), stage=$("stage");
let pan={x:0,y:0}, planZoom=1;
let mode="plan", playing=false, tNow=0, tl=null, stopsCache=[], lastTs=0, hover=null, dirty=false, rState={};
const formatSize=()=>S.format.split("x").map(Number);
function resize(){
  const [fw,fh]=formatSize(); const r=stage.getBoundingClientRect(); const pad=12;
  const scrubH = mode==="play" ? 58 : 0;
  const aw=Math.max(50,r.width-pad*2), ah=Math.max(50,r.height-pad*2-scrubH);
  let w=aw, h=aw*fh/fw; if(h>ah){h=ah;w=ah*fw/fh}
  const dpr=Math.min(window.devicePixelRatio||1,2);
  view.style.width=w+"px"; view.style.height=h+"px"; view.style.marginBottom=scrubH+"px";
  view.width=Math.round(w*dpr); view.height=Math.round(h*dpr);
  requestDraw();
}
new ResizeObserver(resize).observe(stage);
function requestDraw(){if(!dirty){dirty=true;requestAnimationFrame(loop)}}
function loop(ts){
  if(playing){const dt=Math.min(0.1,(ts-lastTs)/1000);tNow+=dt;if(tNow>=tl.dur){tNow=tl.dur;playing=false;syncPlayUI()}}
  lastTs=ts; dirty=false;
  rState={mode,t:tNow,tl,stops:mode==="plan"?route.map(getPlace):stopsCache,hover:mode==="plan"?hover:null,px:view.width/Math.max(1,view.clientWidth)};
  render(vctx,view.width,view.height,rState);
  if(mode==="play"){$("scrubber").value=tNow;$("time").textContent=fmt(tNow)+" / "+fmt(tl.dur)}
  if(playing){dirty=true;requestAnimationFrame(loop)}
}
const fmt=s=>{s=Math.max(0,s);return Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0")};
const ICON_PLAY='<svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg>';
const ICON_PAUSE='<svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 1.5h3v11H3zM8 1.5h3v11H8z" fill="currentColor"/></svg>';
function syncPlayUI(){
  const atEnd=tl&&tNow>=tl.dur-0.05;
  $("play").textContent= playing?"Pause": (mode==="play"&&atEnd)?"Replay": (mode==="play"&&tNow>0)?"Resume":"Play";
  $("scrubPlay").innerHTML=playing?ICON_PAUSE:ICON_PLAY; $("scrubPlay").setAttribute("aria-label",playing?"Pause":"Play");
  $("scrub").hidden=mode!=="play"; $("hint").hidden=mode!=="plan";
  $("play").disabled=!route.length; $("export").disabled=!route.length||exporting;
}
function rebuild(){stopsCache=route.map(getPlace);const [w,h]=formatSize();tl=buildTimeline(stopsCache,w/h);$("scrubber").max=tl.dur;tNow=Math.min(tNow,tl.dur)}
function setMode(m){if(mode===m)return;mode=m;if(m==="plan"){playing=false;tNow=0}resize();syncPlayUI();showZoom()}
function togglePlay(){
  if(!route.length)return;
  if(mode==="plan"){rebuild();tNow=0;setMode("play")}
  else if(playing){playing=false;syncPlayUI();return}
  if(tNow>=tl.dur-0.05)tNow=0;
  playing=true; lastTs=performance.now(); syncPlayUI(); requestDraw();
}
$("play").onclick=togglePlay; $("scrubPlay").onclick=togglePlay;
$("backPlan").onclick=()=>setMode("plan");
$("scrubber").oninput=e=>{playing=false;tNow=+e.target.value;syncPlayUI();requestDraw()};

// map interaction (plan mode)
function prefAt(ev){
  const v=rState.view; if(!v)return null; const r=view.getBoundingClientRect();
  const px=(ev.clientX-r.left)*view.width/r.width, py=(ev.clientY-r.top)*view.height/r.height;
  vctx.save(); vctx.setTransform(v.s,0,0,v.s,v.ox,v.oy);
  let hit=null; for(const p of PREFS){if(vctx.isPointInPath(p.path,px,py)){hit=p;break}}
  vctx.restore(); return hit;
}
let drag=null, dragged=false;
const curZoom=()=>mode==="plan"?planZoom:S.zoom;
function showZoom(){$("zoomReset").textContent=Math.round(curZoom()*100)+"%";$("zoomReset").title=mode==="plan"?"Planning view zoom":"Video zoom"}
function setZoom(z,anchor){
  z=clamp(Math.round(z*100)/100,mode==="plan"?1:0.5,mode==="plan"?8:4); const old=curZoom(); if(z===old)return;
  if(mode==="plan"&&anchor&&rState.view){
    const r=view.getBoundingClientRect(), k=view.width/r.width;
    const px=(anchor.clientX-r.left)*k, py=(anchor.clientY-r.top)*k;
    const v=rState.view, wx=(px-v.ox)/v.s, wy=(py-v.oy)/v.s, s2=v.s*z/old;
    const c=fit(JAPAN,view.width/view.height,1.04,0);
    pan.x=wx-(px-view.width/2)/s2-c.cx; pan.y=wy-(py-view.height/2)/s2-c.cy;
  }
  if(mode==="plan"){planZoom=z;if(z<=1){pan.x=pan.y=0}}
  else{S.zoom=z;$("zoom").value=z;$("zoomo").textContent=Math.round(z*100)+"%";persist()}
  showZoom(); requestDraw();
}
$("zoomIn").onclick=()=>setZoom(curZoom()*1.25);
$("zoomOut").onclick=()=>setZoom(curZoom()/1.25);
$("zoomReset").onclick=()=>{if(mode==="plan")pan.x=pan.y=0;setZoom(1);requestDraw()};
view.addEventListener("wheel",ev=>{ev.preventDefault();if(exporting)return;setZoom(curZoom()*Math.exp(-ev.deltaY*0.0015),ev)},{passive:false});
view.addEventListener("pointerdown",ev=>{if(mode!=="plan")return;drag={x:ev.clientX,y:ev.clientY,px:pan.x,py:pan.y};dragged=false});
window.addEventListener("pointerup",()=>{drag=null});
view.addEventListener("pointermove",ev=>{
  if(drag&&mode==="plan"&&rState.view){const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;
    if(dragged||Math.hypot(dx,dy)>5){dragged=true;const k=view.width/view.getBoundingClientRect().width;
      pan.x=drag.px-dx*k/rState.view.s;pan.y=drag.py-dy*k/rState.view.s;view.style.cursor="grabbing";requestDraw();return}}
  if(mode!=="plan")return;const h=prefAt(ev);if(h!==hover){hover=h;view.style.cursor=h?"pointer":"default";view.title=h?`${h.en} ${h.ja}`:"";requestDraw()}});
view.addEventListener("pointerleave",()=>{if(hover){hover=null;requestDraw()}});
view.addEventListener("click",ev=>{if(mode!=="plan"||dragged)return;const h=prefAt(ev);if(h)addStop({kind:"pref",id:h.id})});

/* ---------- panel: places list ---------- */
let tab="pref";
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-selected",x===b));renderList()});
$("q").oninput=renderList;
function orderBadge(kind,id){const n=[];route.forEach((r,i)=>{if(r.kind===kind&&r.id===id)n.push(i+1)});return n.length?`<span class="badge">${n.join(", ")}</span>`:'<span class="plus" aria-hidden="true">+</span>'}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function renderList(){
  const q=$("q").value.trim().toLowerCase(); const el=$("list"); const keep=el.scrollTop;
  const items= tab==="pref"?PREFS:CITIES;
  const match=p=>!q||p.en.toLowerCase().includes(q)||p.ja.includes(q)||(p.kind==="city"&&(PREF_META[p.pref-1][0].toLowerCase().includes(q)||PREF_META[p.pref-1][1].includes(q)));
  let html="";
  REGIONS.forEach((rg,ri)=>{const xs=items.filter(p=>p.region===ri&&match(p));if(!xs.length)return;
    html+=`<div class="grp"><h3>${rg}</h3>`;
    for(const p of xs){const sub=p.kind==="city"?`<span class="sub">${PREF_META[p.pref-1][1]}</span>`:"";
      html+=`<button class="item" data-kind="${p.kind}" data-id="${p.id}"><span class="nm">${esc(p.ja)}<span class="ja">${p.ja!==p.en?esc(p.en):""}</span>${sub}</span>${orderBadge(p.kind,p.id)}</button>`}
    html+="</div>";
  });
  el.innerHTML=html||`<p class="none">No places match “${esc($("q").value)}”.</p>`; el.scrollTop=keep;
}
$("list").onclick=e=>{const b=e.target.closest(".item");if(b)addStop({kind:b.dataset.kind,id:+b.dataset.id})};

/* ---------- panel: route ---------- */
function msg(t){$("msg").textContent=t||""}
function addStop(r){
  const last=route[route.length-1];
  if(last&&last.kind===r.kind&&last.id===r.id){msg(`${getPlace(r).en} is already the last stop.`);return}
  route.push(r); msg(""); routeChanged();
}
function routeChanged(){persist();setMode("plan");renderRoute();renderList();syncPlayUI();requestDraw()}
const IC={up:'<svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 9l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
down:'<svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
del:'<svg width="14" height="14" viewBox="0 0 14 14"><path d="M3.5 3.5l7 7M10.5 3.5l-7 7" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>'};
function renderRoute(){
  const ol=$("route");
  ol.innerHTML=route.map((r,i)=>{const p=getPlace(r);const kind=p.kind==="pref"?"province":`city in ${PREF_META[p.pref-1][1]}`;
    return `<li><span class="n">${i+1}</span><span class="nm"><span lang="vi">${esc(p.ja)}</span><small>${kind}</small></span>
    <button data-a="up" data-i="${i}" aria-label="Move ${esc(p.en)} up" ${i===0?"disabled":""}>${IC.up}</button>
    <button data-a="down" data-i="${i}" aria-label="Move ${esc(p.en)} down" ${i===route.length-1?"disabled":""}>${IC.down}</button>
    <button data-a="del" data-i="${i}" aria-label="Remove ${esc(p.en)}">${IC.del}</button></li>`}).join("");
  $("emptyRoute").hidden=route.length>0;
  $("count").textContent=route.length?`${route.length} ${route.length===1?"stop":"stops"}`:"";
  ["sortNS","reverse","clear"].forEach(id=>$(id).disabled=route.length<(id==="clear"?1:2));
}
$("route").onclick=e=>{const b=e.target.closest("button");if(!b)return;const i=+b.dataset.i;
  if(b.dataset.a==="del")route.splice(i,1);
  else{const j=b.dataset.a==="up"?i-1:i+1;if(j<0||j>=route.length)return;[route[i],route[j]]=[route[j],route[i]]}
  routeChanged()};
$("sortNS").onclick=()=>{route.sort((a,b)=>getPlace(b).lat-getPlace(a).lat);routeChanged()};
$("reverse").onclick=()=>{route.reverse();routeChanged()};
$("clear").onclick=()=>{route=[];routeChanged()};

/* ---------- panel: settings ---------- */
const OUT={routeW:v=>v+" px",bend:v=>v==0?"straight":(v>0?"right ":"left ")+Math.abs(v)+"%",prefW:v=>v+" px",cityR:v=>v+" px",mapW:v=>v+" px",landOpacity:v=>v+"%",labelSize:v=>v+" px",zoom:v=>Math.round(v*100)+"%",speed:v=>(+v).toFixed(1)+"×",pause:v=>(+v).toFixed(1)+" s"};
const TIMING=new Set(["speed","pause","follow","format","bend"]);
function applyAccent(){document.documentElement.style.setProperty("--accent",S.routeColor);document.documentElement.style.setProperty("--accent-ink",lum(S.routeColor)>0.45?"#151515":"#ffffff")}
Object.keys(DEFAULTS).forEach(k=>{const el=$(k);if(!el)return;
  if(el.type==="checkbox")el.checked=!!S[k]; else el.value=S[k];
  if(OUT[k])$(k+"o").textContent=OUT[k](S[k]);
  el.addEventListener("input",()=>{
    S[k]= el.type==="checkbox"?el.checked : el.type==="range"?+el.value : el.value;
    if(OUT[k])$(k+"o").textContent=OUT[k](S[k]);
    if(k==="routeColor")applyAccent();
    if(k==="zoom")showZoom();
    if(k==="format")resize();
    if(TIMING.has(k)&&mode==="play"){const r=tl.dur?tNow/tl.dur:0;rebuild();tNow=r*tl.dur}
    persist(); requestDraw();
  });
});
applyAccent();
showZoom();

/* ---------- MP4 export ---------- */
let exporting=false, cancelReq=false, lastBlob=null;
let downloadsP=null;
function getDownloads(){if(!downloadsP){downloadsP=(window.claude&&typeof window.claude.use==="function")?window.claude.use("downloads").catch(()=>null):Promise.resolve(null)}return downloadsP}
getDownloads();
async function saveBlob(blob){
  const name=`vietnam-route-${route.length}-stops.mp4`;
  const dl=await getDownloads();
  if(dl){
    try{await dl.save({filename:name,data:blob});msg("Video saved.");}
    catch(e){
      if(e&&e.code==="declined")msg("Video not saved. Use “Save the last video again” whenever you’re ready.");
      else if(e&&e.code==="rate_limited")msg("A save prompt is already open. Try again in a moment.");
      else if(e&&e.code==="too_large")msg("The video is too large for this save. Try 1280 × 720.");
      else msg("Saving isn’t available here. Open this page in claude.ai to save the video.");
    }
  } else {
    const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),60000); msg("Video saved.");
  }
}
$("again").onclick=()=>{if(lastBlob)saveBlob(lastBlob)};
$("cancel").onclick=()=>{cancelReq=true};
async function pickCodec(W,H,fps,bitrate){
  const opts=[["avc","avc1.640028"],["avc","avc1.4d0028"],["avc","avc1.640033"],["avc","avc1.42e028"],["avc","avc1.42003e"],["vp9","vp09.00.40.08"],["av1","av01.0.08M.08"]];
  for(const [m,c] of opts){
    try{const cfg={codec:c,width:W,height:H,bitrate,framerate:fps};if(m==="avc")cfg.avc={format:"avc"};const r=await VideoEncoder.isConfigSupported(cfg);if(r.supported)return {m,c}}catch(e){}
  }
  return null;
}
$("export").onclick=async()=>{
  if(exporting||!route.length)return;
  if(typeof VideoEncoder==="undefined"||typeof VideoFrame==="undefined"||typeof Mp4Muxer==="undefined"){
    msg("This browser can’t encode MP4 video. Open the page in Chrome, Edge, or Safari 17 or later.");return}
  const [W,H]=formatSize(), fps=30, bitrate=Math.round(W*H*fps*0.14);
  const pick=await pickCodec(W,H,fps,bitrate);
  if(!pick){msg(`This browser can’t encode video at ${W} × ${H}. Try another size, or Chrome.`);return}
  exporting=true; cancelReq=false; playing=false; syncPlayUI(); msg("");
  $("prog").hidden=false; $("progBar").style.width="0%"; $("progText").textContent="Preparing";
  let err=null;
  try{
    await document.fonts.ready;
    const stops=route.map(getPlace), tline=buildTimeline(stops,W/H);
    const n=Math.ceil(tline.dur*fps)+1;
    const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),video:{codec:pick.m,width:W,height:H},fastStart:"in-memory"});
    const enc=new VideoEncoder({output:(chunk,meta)=>muxer.addVideoChunk(chunk,meta),error:e=>{err=e}});
    const cfg={codec:pick.c,width:W,height:H,bitrate,framerate:fps,latencyMode:"quality"};if(pick.m==="avc")cfg.avc={format:"avc"};
    enc.configure(cfg);
    const cv=document.createElement("canvas");cv.width=W;cv.height=H;const c=cv.getContext("2d");
    for(let i=0;i<n;i++){
      if(cancelReq||err)break;
      render(c,W,H,{mode:"play",t:i/fps,tl:tline,stops});
      const vf=new VideoFrame(cv,{timestamp:Math.round(i*1e6/fps),duration:Math.round(1e6/fps)});
      enc.encode(vf,{keyFrame:i%(fps*2)===0}); vf.close();
      while(enc.encodeQueueSize>6&&!err)await new Promise(r=>setTimeout(r,4));
      if(i%4===0){const pct=Math.round(i/n*100);$("progBar").style.width=pct+"%";$("progText").textContent=`Rendering ${pct}%`;await new Promise(r=>setTimeout(r,0))}
    }
    if(err)throw err;
    if(cancelReq){try{enc.close()}catch(e){}msg("Export cancelled.");}
    else{
      $("progText").textContent="Finishing";
      await enc.flush(); enc.close(); muxer.finalize();
      lastBlob=new Blob([muxer.target.buffer],{type:"video/mp4"});
      $("again").hidden=false; $("progBar").style.width="100%";
      await saveBlob(lastBlob);
      if(pick.m!=="avc")msg(($("msg").textContent+" This browser has no H.264 encoder, so the MP4 uses "+pick.m.toUpperCase()+", which some players such as QuickTime can’t open. Chrome, Edge, or Safari give the most compatible file.").trim());
    }
  }catch(e){console.error(e);msg("The export stopped: "+(e&&e.message?e.message:e)+". Try a smaller size.")}
  exporting=false; $("prog").hidden=true; syncPlayUI();
};

/* ---------- init ---------- */
renderList(); renderRoute(); syncPlayUI();
document.fonts.load(`700 40px "Be Vietnam Pro"`,"Đà Nẵng Huế").then(requestDraw).catch(()=>{});
</script>
</body>
